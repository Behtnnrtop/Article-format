<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>长文排版</title>
    <script>
        (function () {
            if (document.documentMode) {
                document.documentElement.className += (document.documentElement.className ? " " : "") + "unsupported-browser";
            }
        })();
    </script>
    <style>
        .unsupportedBrowserNotice{
            display:none;
        }

        html.unsupported-browser body{
            display:block;
            width:auto;
            height:auto;
            min-height:100vh;
            overflow:auto;
            background:#f6f7f9;
        }

        html.unsupported-browser #customColorModalBackdrop,
        html.unsupported-browser #copyStyleModal,
        html.unsupported-browser #articleManagerBackdrop,
        html.unsupported-browser #preview,
        html.unsupported-browser #phoneRenderHost,
        html.unsupported-browser .previewExportActions,
        html.unsupported-browser #mobileTypesetRefreshBtn,
        html.unsupported-browser .mobileCurrentWordCount,
        html.unsupported-browser #dragBar,
        html.unsupported-browser #editor,
        html.unsupported-browser .phonePreviewPanel{
            display:none !important;
        }

        html.unsupported-browser .unsupportedBrowserNotice{
            display:block;
            max-width:520px;
            margin:96px auto;
            padding:28px;
            border:1px solid #d8dee8;
            border-radius:8px;
            color:#1f2937;
            font-family:"Microsoft YaHei",Arial,sans-serif;
            background:#ffffff;
            box-shadow:0 12px 32px rgba(15,23,42,.12);
        }

        .unsupportedBrowserNotice h1{
            margin:0 0 12px;
            font-size:24px;
            line-height:1.35;
        }

        .unsupportedBrowserNotice p{
            margin:0 0 10px;
            color:#4b5563;
            font-size:15px;
            line-height:1.7;
        }
    </style>
    <link rel="stylesheet" href="style.css?v=90">
</head>
<body>
    <div id="unsupportedBrowserNotice" class="unsupportedBrowserNotice" role="alert">
        <h1>当前浏览器不支持该网站</h1>
        <p>抱歉，这个网站目前不支持 360 兼容模式 / IE 内核。</p>
        <p>请在切换到360极速模式，使用 Chrome、Edge 浏览器，或更新浏览器版本后重新尝试。</p>
    </div>
    <div id="customColorModalBackdrop" class="customColorModalBackdrop" hidden></div>
    <div id="copyStyleModal" class="copyStyleModal" hidden role="dialog" aria-modal="true" aria-labelledby="copyStyleModalTitle">
        <div class="copyStyleDialog">
            <div class="copyStyleHeader">
                <div>
                    <h3 id="copyStyleModalTitle">复制样式到</h3>
                    <p id="copyStyleSourceLabel"></p>
                </div>
                <button type="button" class="copyStyleCloseBtn" aria-label="关闭" onclick="closeCopyStyleModal()">×</button>
            </div>
            <div id="copyStyleArticleList" class="copyStyleArticleList"></div>
            <div class="copyStyleActions">
                <button type="button" class="copyStyleCancelBtn" onclick="closeCopyStyleModal()">取消</button>
                <button type="button" class="copyStyleApplyBtn" onclick="confirmCopyStyleToArticles()">复制样式</button>
            </div>
        </div>
    </div>
    <div id="articleManagerBackdrop" class="articleManagerBackdrop" hidden></div>
    <div id="preview">
        <div id="posterTypesettingOverlay" class="posterTypesettingOverlay visible" aria-hidden="false">
            <div class="posterTypesettingMessage">正在排版...</div>
        </div>
        <div id="poster" class="posterRoot">
            <div id="header" class="posterHeader" data-poster-part="header">
                <div id="year" class="posterYear" data-poster-part="year"></div>
            </div>
            <div id="subtitle" class="posterSubtitle" data-poster-part="subtitle"></div>
            <div id="side" class="posterSide" data-poster-part="side"></div>
            <div id="cards" class="posterCards" data-poster-part="cards"></div>
            <div id="copyright" class="posterCopyright" data-poster-part="copyright">制图：@Behtnnrtop</div>
        </div>
    </div>

    <div id="phoneRenderHost" class="phoneRenderHost" aria-hidden="true"></div>

    <div class="previewExportActions" aria-label="导出图片">
        <div class="currentWordCount" data-current-word-count aria-live="polite">当前字符数：0</div>
        <button id="previewExportBtn" class="previewExportBtn" type="button" onclick="exportImage()">导出长图</button>
        <button id="previewExportSlicesBtn" class="previewExportBtn secondary" type="button" onclick="exportSlicedImagesZip()">导出已切图</button>
    </div>

    <button id="mobileTypesetRefreshBtn" class="mobileTypesetRefreshBtn" type="button" onclick="refreshMobileTypesetting()">刷新排版</button>
    <div class="currentWordCount mobileCurrentWordCount" data-current-word-count aria-live="polite">当前字符数：0</div>

    <div id="dragBar">
        <button id="editorCollapseBtn" type="button" title="收起编辑器" aria-label="收起编辑器" onclick="toggleEditorCollapsed(event)">›</button>
    </div>

    <div id="editor">
        <div class="mobileExportWarning">如果字符数大于7000，请不要在手机端导出图片</div>

        <div class="editorTopActions" data-mobile-panel="article">
            <button id="donateBtn" type="button" aria-label="支持网站" title="支持网站" onclick="window.open('https://share.mubu.com/doc/5UcQ7YVxdct','_blank','noopener,noreferrer')">支持网站</button>
            <button id="articleManagerBtn" type="button" onclick="openArticleManagerModal()">文章管理</button>
        </div>

        <div class="articleManager articleManagerPanel" data-mobile-panel="article" aria-label="文章管理">
            <label for="articleSelect">文章管理</label>
            <select id="articleSelect" onchange="switchArticle(this.value)"></select>
            <button type="button" onclick="createArticle()">新建</button>
            <button type="button" onclick="renameArticle()">重命名</button>
            <button type="button" onclick="openCopyStyleModal()">复制样式到</button>
            <button id="deleteArticleBtn" class="danger" type="button" onclick="deleteArticle()">删除</button>
        </div>

        <div class="editorHeader">
            <h2>编辑器</h2>
            <div class="editorHeaderActions" data-mobile-panel="text">
                <button id="bottomWatermarkToggleBtn" type="button" onclick="toggleBottomWatermark()">隐藏底部水印</button>
                <button id="phonePreviewToggleBtn" type="button" onclick="togglePhonePreview()">显示手机预览</button>
            </div>
        </div>

        <div class="mobileEditorTabs" role="tablist" aria-label="手机属性分组">
            <button type="button" class="mobileEditorTab" data-mobile-tab="article" role="tab" aria-selected="false" onclick="setMobileEditorPanel('article')">文章</button>
            <button type="button" class="mobileEditorTab active" data-mobile-tab="style" role="tab" aria-selected="true" onclick="setMobileEditorPanel('style')">总样式</button>
            <button type="button" class="mobileEditorTab" data-mobile-tab="text" role="tab" aria-selected="false" onclick="setMobileEditorPanel('text')">标题</button>
            <button type="button" class="mobileEditorTab" data-mobile-tab="blocks" role="tab" aria-selected="false" onclick="setMobileEditorPanel('blocks')">段落</button>
            <button type="button" class="mobileEditorTab" data-mobile-tab="export" role="tab" aria-selected="false" onclick="setMobileEditorPanel('export')">导出</button>
        </div>

        <div class="editItem phoneResolutionPanel" data-mobile-panel="export">
            <label for="phoneResolutionSelect">导出手机分辨率</label>
            <select id="phoneResolutionSelect" class="phoneResolutionSelect">
                <option value="720x1600">720 × 1600</option>
                <option value="1080x1920">1080 × 1920</option>
                <option value="1080x2376">1080 × 2376</option>
                <option value="1080x2400">1080 × 2400</option>
                <option value="1170x2532">1170 × 2532</option>
                <option value="1220x2712">1220 × 2712</option>
                <option value="1290x2796">1290 × 2796</option>
                <option value="1440x3200">1440 × 3200</option>
            </select>
            <div class="resolutionHint">手机预览和长图导出会按当前分辨率实时渲染</div>
        </div>

        <button id="exportBtn" class="mobileExportBtn" data-mobile-panel="export" onclick="exportImage()">导出长图</button>
        <button id="exportSlicesBtn" class="mobileExportBtn" data-mobile-panel="export" onclick="exportSlicedImagesZip()">导出已切图</button>

        <div class="editItem" data-mobile-panel="style">
            <div class="colorControlGroup">
                <label>字体颜色</label>
                <div id="textColorPalette" class="bgPalette"></div>
                <div class="inlineFontLoader">
                    <button id="loadFontsBtn" type="button">读取本机字体</button>
                    <div id="fontStatus" class="fontStatus"></div>
                </div>
                <div id="textCustomColorPanel" class="customColorPanel" hidden>
                    <div class="customColorField" id="textColorField">
                        <span class="customColorFieldCursor" id="textColorFieldCursor"></span>
                    </div>
                    <input type="range" id="textHueRange" class="customHueRange" min="0" max="360" value="0" aria-label="字体颜色色相">
                    <div class="customColorInputs">
                        <span class="customColorPreviewChip" id="textColorPreviewChip"></span>
                        <input type="text" id="textHexInput" class="customHexInput" value="#111111" aria-label="字体颜色 HEX">
                    </div>
                    <div class="customRgbInputs">
                        <label>R <input type="number" id="textRedInput" min="0" max="255" value="17"></label>
                        <label>G <input type="number" id="textGreenInput" min="0" max="255" value="17"></label>
                        <label>B <input type="number" id="textBlueInput" min="0" max="255" value="17"></label>
                    </div>
                    <div class="customColorActions">
                        <button type="button" class="customColorCancel" onclick="cancelTextCustomColor()">取消</button>
                        <button type="button" class="customColorApply" onclick="confirmTextCustomColor()">确认颜色</button>
                    </div>
                </div>
            </div>

            <div class="colorControlGroup">
                <label>背景颜色</label>
                <div id="bgPalette" class="bgPalette"></div>
                <div id="backgroundCustomColorPanel" class="customColorPanel" hidden>
                    <div class="customColorField" id="backgroundColorField">
                        <span class="customColorFieldCursor" id="backgroundColorFieldCursor"></span>
                    </div>
                    <input type="range" id="backgroundHueRange" class="customHueRange" min="0" max="360" value="0" aria-label="背景颜色色相">
                    <div class="customColorInputs">
                        <span class="customColorPreviewChip" id="backgroundColorPreviewChip"></span>
                        <input type="text" id="backgroundHexInput" class="customHexInput" value="#efefef" aria-label="背景颜色 HEX">
                    </div>
                    <div class="customRgbInputs">
                        <label>R <input type="number" id="backgroundRedInput" min="0" max="255" value="239"></label>
                        <label>G <input type="number" id="backgroundGreenInput" min="0" max="255" value="239"></label>
                        <label>B <input type="number" id="backgroundBlueInput" min="0" max="255" value="239"></label>
                    </div>
                    <div class="customColorActions">
                        <button type="button" class="customColorCancel" onclick="cancelBackgroundCustomColor()">取消</button>
                        <button type="button" class="customColorApply" onclick="confirmBackgroundCustomColor()">确认颜色</button>
                    </div>
                </div>
            </div>

            <div class="backgroundImagePanel">
                <label for="backgroundImageInput">背景图片</label>
                <input type="file" id="backgroundImageInput" accept="image/*" class="hiddenFileInput">
                <div class="backgroundImageActions">
                    <button type="button" onclick="openBackgroundImagePicker()">上传图片</button>
                    <button type="button" id="removeBackgroundImageBtn" onclick="removeBackgroundImage()">移除图片</button>
                </div>
                <div id="backgroundImageStatus" class="backgroundImageStatus">未上传背景图片</div>
                <div id="backgroundImagePreview" class="backgroundImagePreview" hidden></div>
            </div>
        </div>

        <div class="editItem" data-mobile-panel="style">
            <div class="spacingControls">
                <label for="sideSpacingInput">
                    两侧间距
                    <input type="number" id="sideSpacingInput" min="-120" max="240" step="2" value="0">
                </label>
                <label for="paragraphTitleSpacingInput">
                    段落标题间距
                    <input type="number" id="paragraphTitleSpacingInput" min="-40" max="80" step="1" value="0">
                </label>
                <label for="moduleSpacingInput">
                    模块间距
                    <input type="number" id="moduleSpacingInput" min="0" max="160" step="2" value="58">
                </label>
                <label for="topPaddingInput">
                    图片顶部预留
                    <input type="number" id="topPaddingInput" min="0" max="240" step="2" value="58">
                </label>
                <label for="sideHeaderReserveInput">
                    竖排标题右侧预留
                    <input type="number" id="sideHeaderReserveInput" min="0" max="240" step="2" value="0">
                </label>
            </div>
        </div>

        <div class="editItem" data-mobile-panel="text">
            <label>
                顶部标题
                <button onclick="changeYearSize(-2)">A-</button>
                <button onclick="changeYearSize(2)">A+</button>
                <button id="yearShadowToggleBtn" type="button" onclick="toggleYearShadow()">隐藏标题阴影</button>
                <span id="yearSizeValue" class="sizeValue"></span>
            </label>
            <div class="headlineFontRow">
                <select id="yearFontSelect" class="fontSelect blockFontSelect" onchange="changeYearFont(this.value,this)"></select>
                <div id="yearAlignControls" class="headlineAlignControls"></div>
            </div>
            <textarea id="yearInput" rows="2" placeholder="输入标题..."></textarea>
        </div>

        <div class="editItem" data-mobile-panel="text">
            <label>
                副标题
                <button onclick="changeSubtitleSize(-1)">A-</button>
                <button onclick="changeSubtitleSize(1)">A+</button>
                <button id="subtitlePositionToggleBtn" type="button" onclick="toggleSubtitlePosition()">竖排左侧</button>
                <span id="subtitleSizeValue" class="sizeValue"></span>
            </label>
            <div class="headlineFontRow">
                <select id="subtitleFontSelect" class="fontSelect blockFontSelect" onchange="changeSubtitleFont(this.value,this)"></select>
                <div id="subtitleAlignControls" class="headlineAlignControls"></div>
            </div>
            <textarea id="subtitleInput" rows="2" placeholder="输入副标题..."></textarea>
        </div>

        <div class="editItem" data-mobile-panel="text">
            <label>
                右侧竖排标题
                <button onclick="changeSideSize(-2)">A-</button>
                <button onclick="changeSideSize(2)">A+</button>
                <button id="sideHeaderToggleBtn" type="button" onclick="toggleSideHeader()">隐藏竖排标题</button>
                <span id="sideSizeValue" class="sizeValue"></span>
            </label>
            <select id="sideFontSelect" class="fontSelect blockFontSelect" onchange="changeSideFont(this.value,this)"></select>
            <textarea id="sideInput" rows="2" placeholder="输入竖排标题..."></textarea>
        </div>

        <div class="addBlockActions" data-mobile-panel="blocks">
            <button id="addBtn" type="button" onclick="addTextCard()">＋ 文字段落</button>
            <button id="addImageBtn" type="button" onclick="addImageCard()">＋ 图片段落</button>
        </div>

        <div class="cardSortAction" data-mobile-panel="blocks">
            <button id="cardSortModeBtn" type="button" onclick="toggleCardSortMode()">调整段落顺序</button>
        </div>

        <div class="paragraphDisplayActions" data-mobile-panel="blocks">
            <button id="timelineToggleBtn" type="button" onclick="toggleTimeline()">隐藏时间轴</button>
            <button id="monthTitleToggleBtn" type="button" onclick="toggleMonthTitles()">隐藏段落标题</button>
            <button id="underlineToggleBtn" type="button" onclick="toggleMonthUnderlines()">隐藏段落标题横线</button>
        </div>

        <div id="cardEditor" data-mobile-panel="blocks"></div>
    </div>

    <div id="phonePreviewPanel" class="phonePreviewPanel" hidden>
        <div class="phonePreviewHeader">
            <label>手机预览</label>
            <div class="phonePreviewZoom">
                <button type="button" title="缩小手机预览" onclick="changePhonePreviewScale(-0.1)">-</button>
                <span id="phonePreviewScaleValue">100%</span>
                <button type="button" title="放大手机预览" onclick="changePhonePreviewScale(0.1)">+</button>
            </div>
        </div>
        <div class="phoneMockup">
            <div id="phoneScreen" class="phoneScreen">
                <div id="phoneTopPadding" class="phoneTopPadding"></div>
                <div class="phoneStatusBar">
                    <span>9:41</span>
                    <span class="phoneStatusIcons">
                        <span class="phoneSignal"></span>
                        <span class="phoneWifi"></span>
                        <span class="phoneBattery"></span>
                    </span>
                </div>
                <div id="phoneCanvasWrap" class="phoneCanvasWrap">
                    <div id="phoneCanvas" class="phoneCanvas"></div>
                </div>
                <div id="phoneWatermark" class="phoneWatermark"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";

            function showUnsupportedBrowserNotice() {
                var notice = document.getElementById("unsupportedBrowserNotice");
                if (notice) {
                    notice.style.display = "block";
                }
            }

            if (document.documentMode) {
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", showUnsupportedBrowserNotice);
                } else {
                    showUnsupportedBrowserNotice();
                }
                return;
            }

            var scripts = [
                "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
                "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
                "paragraphs.js?v=20260901-4",
                "image-store.js?v=20260826-1",
                "layout.js?v=20260910-1",
                "export.js?v=20260910-1",
                "script.js?v=20260910-9",
                "analytics.js?v=20260910-1"
            ];

            function loadScript(index) {
                var script;
                if (index >= scripts.length) return;

                script = document.createElement("script");
                script.src = scripts[index];
                script.onload = function () {
                    loadScript(index + 1);
                };
                script.onerror = function () {
                    console.error("Script load failed:", scripts[index]);
                    loadScript(index + 1);
                };
                document.body.appendChild(script);
            }

            loadScript(0);
        })();
    </script>

</body>
</html>
